name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # se actualiza todos los días a medianoche
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: reigenabril
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=pink&color_dots=#ffe5f0,#ffb3d9,#ff80c0,#ff4da6,#e6007e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=pink

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
